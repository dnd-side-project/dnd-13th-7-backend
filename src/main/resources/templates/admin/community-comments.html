<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Community Comments</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Comments</h4>
                    <form class="form-inline mb-3" th:action="@{/admin/community/comments}" method="get">
                        <input class="form-control mr-2" type="text" name="keyword" placeholder="Search content"
                               th:value="${keyword}">
                        <select class="form-control mr-2" name="status" onchange="this.form.submit()">
                            <option value="">All Status</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${status == s}"></option>
                        </select>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Post ID</th>
                                <th>User</th>
                                <th>Content</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="comment : ${comments.content}">
                                <td th:text="${comment.id}">1</td>
                                <td th:text="${comment.post != null ? comment.post.id : '-'}">-</td>
                                <td th:text="${comment.user != null && comment.user.nickname != null ? comment.user.nickname : (comment.user != null ? comment.user.name : '-') }">User</td>
                                <td>
                                    <span class="d-inline-block text-truncate" style="max-width: 380px;" th:text="${comment.content}">내용</span>
                                </td>
                                <td th:text="${comment.status}">ACTIVE</td>
                                <td th:text="${comment.createdAt}">2024-01-01</td>
                                <td>
                                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/community/comments/{id}(id=${comment.id})}">View</a>
                                </td>
                            </tr>
                            <tr th:if="${comments.totalElements == 0}">
                                <td colspan="7">No comments found.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3 d-flex justify-content-between align-items-center">
                        <span th:text="${comments.totalPages > 0 ? 'Page ' + (comments.number + 1) + ' / ' + comments.totalPages : 'Page 0 / 0'}">Page</span>
                        <ul class="pagination pagination-sm mb-0" th:if="${comments.totalPages > 0}">
                            <li class="page-item"
                                th:each="pageNum : ${#numbers.sequence(0, comments.totalPages - 1)}"
                                th:classappend="${pageNum == comments.number} ? ' active' : ''">
                                <a class="page-link"
                                   th:href="@{/admin/community/comments(page=${pageNum}, keyword=${keyword}, status=${status})}"
                                   th:text="${pageNum + 1}">1</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
