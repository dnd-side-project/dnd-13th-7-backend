<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Clubs</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Clubs</h4>
                    <div class="alert alert-success" th:if="${message}">
                        <span th:text="${message}">Success</span>
                    </div>
                    <form class="form-inline mb-3" th:action="@{/admin/clubs}" method="get">
                        <input class="form-control mr-2" type="text" name="keyword" placeholder="Search name"
                               th:value="${keyword}">
                        <button class="btn btn-outline-primary" type="submit">Filter</button>
                        <a class="btn btn-primary ml-auto" th:href="@{/admin/clubs/new}">New Club</a>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Recruiting</th>
                                <th>Subscribers</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="club : ${clubs.content}">
                                <td th:text="${club.id}">1</td>
                                <td th:text="${club.name}">Club</td>
                                <td th:text="${club.recruiting}">false</td>
                                <td th:text="${club.subscribeCount}">0</td>
                                <td>
                                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/clubs/{id}(id=${club.id})}">View</a>
                                </td>
                            </tr>
                            <tr th:if="${clubs.totalElements == 0}">
                                <td colspan="5">No clubs found.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3 d-flex justify-content-between">
                        <span th:text="'Page ' + ${clubs.number + 1} + ' / ' + ${clubs.totalPages}">Page</span>
                        <div>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/clubs(page=${clubs.number - 1}, keyword=${keyword})}"
                               th:if="${clubs.number > 0}">Prev</a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/admin/clubs(page=${clubs.number + 1}, keyword=${keyword})}"
                               th:if="${clubs.number + 1 < clubs.totalPages}">Next</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
