<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row">
        <div class="col-12 grid-margin">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Admin Dashboard</h4>
                    <p class="card-description">커뮤니티와 동아리 정보를 관리합니다.</p>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn btn-primary mr-2" th:href="@{/admin/community/posts}">Manage Posts</a>
                        <a class="btn btn-primary mr-2" th:href="@{/admin/community/comments}">Manage Comments</a>
                        <a class="btn btn-primary" th:href="@{/admin/clubs}">Manage Clubs</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
