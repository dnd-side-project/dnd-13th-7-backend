<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Moyeoit Admin</title>
    <link rel="stylesheet" th:href="@{/vendors/iconfonts/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/vendors/css/vendor.bundle.addons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.png}" />
    <style>
        .sidebar .nav .nav-item .nav-link {
            font-size: 16px;
            font-weight: 600;
            border-left: 3px solid transparent;
            border-radius: 8px;
            margin: 2px 8px;
            padding: 14px;
        }

        .sidebar .nav .nav-item .nav-link .menu-icon {
            font-size: 20px;
        }

        .sidebar .nav .nav-item.active > .nav-link {
            background-color: #edf2ff;
            border-left-color: #3b5bdb;
            color: #1f2937;
        }

        .sidebar .nav .nav-item.active > .nav-link .menu-title,
        .sidebar .nav .nav-item.active > .nav-link i {
            color: #1f2937;
        }

        .sidebar .nav.sub-menu {
            background: #f8fafc;
            border-radius: 8px;
            margin: 4px 12px 10px;
            padding: 6px 0;
        }

        .sidebar .nav.sub-menu .nav-item .nav-link {
            font-size: 14px;
            font-weight: 600;
            padding: 10px 18px 10px 34px;
            color: #4b5563;
        }

        .sidebar .nav.sub-menu .nav-item .nav-link.active,
        .sidebar .nav.sub-menu .nav-item:hover > .nav-link {
            color: #1f2937;
            background: #e9eefb;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div class="container-scroller">

    <!-- partial:partials/_navbar.html -->
    <nav class="navbar default-layout col-lg-12 col-12 p-0 fixed-top d-flex flex-row">
        <div class="text-center navbar-brand-wrapper d-flex align-items-top justify-content-center">
            <a class="navbar-brand brand-logo d-flex align-items-center" th:href="@{/admin}">
                <img th:src="@{/images/moyeoit-logo.png}" alt="모여잇 로고"
                     style="height: 32px; width: auto; margin-right: 8px; object-fit: contain;" />
                <span style="font-size: 18px; font-weight: 700; color: #111111;">모여잇 어드민</span>
            </a>
            <a class="navbar-brand brand-logo-mini" th:href="@{/admin}">
                <img th:src="@{/images/moyeoit-logo.png}" alt="모여잇 로고"
                     style="height: 28px; width: 28px; object-fit: contain;" />
            </a>
        </div>
        <div class="navbar-menu-wrapper d-flex align-items-center">
            <button class="navbar-toggler navbar-toggler d-none d-lg-block navbar-dark align-self-center mr-3" type="button" data-toggle="minimize">
                <span class="navbar-toggler-icon"></span>
            </button>
            <ul class="navbar-nav navbar-nav-right">
                <li class="nav-item d-none d-xl-inline-block">
                    <span class="nav-link">Admin</span>
                </li>
                <li class="nav-item d-none d-xl-inline-block">
                    <form th:action="@{/admin/logout}" method="post">
                        <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
            <button class="navbar-toggler navbar-toggler-right d-lg-none align-self-center" type="button" data-toggle="offcanvas">
                <span class="icon-menu"></span>
            </button>
        </div>
    </nav>

    <!-- partial -->
    <div class="container-fluid page-body-wrapper">
        <!-- partial:partials/_sidebar.html -->
        <nav class="sidebar sidebar-offcanvas"
             id="sidebar"
             th:with="currentUri=${#httpServletRequest?.requestURI ?: ''}">
            <ul class="nav">
                <li class="nav-item" th:classappend="${currentUri == '/admin' or currentUri == '/admin/'} ? ' active' : ''">
                    <a class="nav-link" th:href="@{/admin}">
                        <i class="menu-icon mdi mdi-television"></i>
                        <span class="menu-title">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item" th:classappend="${#strings.startsWith(currentUri, '/admin/community')} ? ' active' : ''">
                    <a class="nav-link"
                       data-toggle="collapse"
                       href="#community"
                       aria-expanded="false"
                       aria-controls="community"
                       th:classappend="${#strings.startsWith(currentUri, '/admin/community')} ? '' : ' collapsed'"
                       th:attr="aria-expanded=${#strings.startsWith(currentUri, '/admin/community')}">
                        <i class="menu-icon mdi mdi-comment-multiple-outline"></i>
                        <span class="menu-title">Community</span>
                        <i class="menu-arrow"></i>
                    </a>
                    <div class="collapse" id="community" th:classappend="${#strings.startsWith(currentUri, '/admin/community')} ? ' show' : ''">
                        <ul class="nav flex-column sub-menu">
                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${#strings.startsWith(currentUri, '/admin/community/posts')} ? ' active' : ''"
                                   th:href="@{/admin/community/posts}">Posts</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${#strings.startsWith(currentUri, '/admin/community/comments')} ? ' active' : ''"
                                   th:href="@{/admin/community/comments}">Comments</a>
                            </li>
                        </ul>
                    </div>
                </li>
                <li class="nav-item" th:classappend="${#strings.startsWith(currentUri, '/admin/clubs')} ? ' active' : ''">
                    <a class="nav-link" th:href="@{/admin/clubs}">
                        <i class="menu-icon mdi mdi-account-group"></i>
                        <span class="menu-title">Clubs</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- partial -->
        <div class="main-panel">
            <div class="content-wrapper" layout:fragment="content">
                Content is Here!
            </div>
            <!-- content-wrapper ends -->

            <!-- partial:partials/_footer.html -->
            <footer class="footer">
                <div class="container-fluid clearfix">
            <span class="text-muted d-block text-center text-sm-left d-sm-inline-block">Copyright © 2018
              <a href="http://www.bootstrapdash.com/" target="_blank">Bootstrapdash</a>. All rights reserved.</span>
                    <span class="float-none float-sm-right d-block mt-1 mt-sm-0 text-center">Hand-crafted & made with
              <i class="mdi mdi-heart text-danger"></i>
            </span>
                </div>
            </footer>
            <!-- partial -->
        </div>
        <!-- main-panel ends -->

    </div>

    <!-- page-body-wrapper ends -->
</div>
<!-- container-scroller -->

<!-- plugins:js -->
<script th:src="@{/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/vendors/js/vendor.bundle.addons.js}"></script>
<script th:src="@{/js/off-canvas.js}"></script>
<script th:src="@{/js/misc.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<script type="text/javascript"></script>


</body>
</html>
