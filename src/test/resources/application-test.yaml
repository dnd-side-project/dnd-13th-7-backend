server:
  port: 8084
  servlet:
    context-path: /api
spring:
  flyway:
    enabled: false
    encoding: UTF-8
  datasource:
    url:
      jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: TEST
            client-secret: TEST
            redirect-uri: TEST
            scope:
              - email
              - profile
          kakao:
            client-id: TEST
            client-secret: TEST
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: TEST
            scope:
              - profile_nickname
              - account_email
            client-authentication-method: client_secret_post
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: TEST
        secret-key: TEST

jwt:
  secret: testasecretakeyaforajwtamustabeaataleasta256abitsalong
  access-token-expire-time: 1800
  refresh-token-expire-time: 604800


management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  newrelic:
    metrics:
      export:
        enabled: false
        api-key: a
        account-id: a
        uri: https://insights-collector.newrelic.com
        step: 1m

app:
  s3:
    bucket: TEST
    urlBase: TEST

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE

oauth:
  google:
    auth:
      client-id: TEST
      client-secret: TEST
      redirect-uri: TEST
      scope:
        - TEST
    api:
      authorization-uri: TEST
      token-uri: TEST
      user-info-uri: TEST
  kakao:
    auth:
      client-id: TEST
      client-secret: TEST
      redirect-uri: TEST
      scope:
        - TEST
    api:
      authorization-uri: TEST
      token-uri: TEST
      user-info-uri: TEST
